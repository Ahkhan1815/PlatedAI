
services:
  plated-client:
    container_name: plated-client
    build:
      context: ./client
    ports:
      - "80:80"
    depends_on:
      - plated-server
  plated-server:
    container_name: plated-server
    build:
      context: ./server
    depends_on:
      - plated-datastore
  plated-datastore:
    container_name: plated-datastore
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
  